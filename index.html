d tall, lower for 2 s.|Keep hips level. A dropping hip is the weakness to fix."],"Leg press":["squat","mach","Feet shoulder-width mid-platform. Lower to about 90 degrees with the lower back flat.|Press through mid-foot, stop short of locking out.|If your hips roll off the pad, you went too deep."],"Sled push":["cond","sled","Low body, 45 degree lean, short fast steps on the balls of the feet.|Hips low and steady, no bobbing.|RPE 7 is Hyrox practice, not a max. Hold the posts lightly to save your forearms."],"Goblet squat":["squat","db","Weight at the chest, elbows inside the knees at the bottom.|Sit between the hips, heels down, chest up.|Pause 1 s at the bottom for depth and control."],"Romanian deadlift":["hinge","bar","Soft knees, push hips back until the hamstrings load. Weight slides down the thighs.|Flat back, lats tight; stop at mid-shin or when the back would round.|Stand up with the glutes, not a lean."],"Bulgarian split squat":["lunge","db","Rear foot on the bench, front foot far enough that the shin stays vertical.|Drop straight down, push through the front heel.|Weaker leg first and copy its reps. Same slide-leg logic as lunges."],"Hip thrust":["hinge","bar","Upper back on the bench, shins vertical at the top.|Tuck the chin and ribs, drive through the heels, squeeze 1 s.|The glutes finish the rep, not the lower back."],"Walking lunge":["lunge","db","Long step, back knee brushes the floor, front knee tracks the toes.|Stay tall and keep steps even.|Hold DBs at your sides so the grip works too."],"DB bench press":["hpush","db","Shoulder blades pinched and down, feet planted, wrists over elbows.|Lower to the chest sides, elbows about 45 degrees, press up and slightly in.|If one arm lags, end the set. Protect the bowling-arm shoulder: no pinch at the front."],"Chest-supported row":["hpull","db","Chest on the pad. Pull the elbows to the hips, not the hands to the chest.|Squeeze the shoulder blades 1 s, lower for 2 s.|More pulling than pressing keeps a throwing shoulder healthy."],"Half-kneeling landmine press":["vpush","bar","Kneel with the pressing-side knee down, glute squeezed, ribs down.|Press up and slightly forward along the bar arc to an ear-height finish.|A shoulder-friendly press for the bowling arm. If the front of the shoulder pinches, cut the load."],"Lat pulldown":["vpull","mach","Chest up. Pull the elbows to your ribs, bar to the upper chest.|Do not lean back to move the weight; control the way up.|Neutral wrists spare the elbow."],"Assisted pull-up":["vpull","mach","Start from a hang with the shoulders down.|Chest to the bar, elbows to the ribs, lower for 3 s.|Use the least assistance that still gives clean reps."],"Face pull":["hpull","mach","Rope at forehead height. Pull to the face, hands finishing wide of the ears.|Rotate the thumbs back and squeeze the rear delts 1 s.|Light and high rep. Shoulder insurance for the bowling arm."],"Incline DB press":["hpush","db","Bench at 30 degrees. Press from the upper chest straight up.|Elbows about 45 degrees, wrists neutral.|Lower slowly and stop short of any shoulder pinch."],"Single-arm cable row":["hpull","mach","Sit or stand tall, pull the elbow past the ribs with a small natural turn.|Brace so the torso does not twist further.|Match reps on the non-bowling arm."],"Seated DB shoulder press":["vpush","db","Back supported, DBs at ear height, press up and slightly together.|Ribs down, no arching.|If the bowling shoulder pinches, swap to the landmine press."],"Pallof press":["core-anti-rot","mach","Stand side-on to the cable, handle at the chest, feet shoulder-width.|Press out, hold 2 s, do not let the torso turn toward the stack.|Bowling twists you one way all day. Take the extra set on the non-bowling side."],"Side plank":["core-lateral","bw","Elbow under the shoulder, feet stacked, hips in a straight line.|Push the floor away and keep the ribs down.|Match the weaker side’s time on both sides."],"Standing anti-rotation hold":["core-anti-rot","mach","Cable or ban
